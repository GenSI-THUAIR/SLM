config:
  mode: train
  diffusion: absorbing_state
  backbone: Mel
  parameterization: new_diff
  prior: uniform
  time_conditioning: true
  T: 1000
  subs_masking: false
  init_pre_embedding: false
  fixed_embedding: false
  embedding_nml: false
  entropy_condition: false
  seed: 1
  logging_dir: csvlogdir
  loader:
    global_batch_size: 128
    eval_global_batch_size: 128
    batch_size: 128
    eval_batch_size: 128
    num_workers: 0
    pin_memory: true
  sampling:
    predictor: ddpm_cache
    steps: 100
    noise_removal: true
    length: 256
    outdir: None
    num_sample_batches: 1
    num_sample_log: 100
    semi_ar: false
    stride_length: 1
    num_strides: 1
  training:
    ema: 0.9999
    antithetic_sampling: true
    importance_sampling: false
    sampling_eps: 0.001
    change_of_variables: false
    beta_bfn: 0.75
    reconstruct_weight: 0.0
    reconstruct_only: false
    different_time: true
    onehot_sparse: true
    top_nums: -1
    linear_trans: 1.0
    scheduler: square
    reconstruct_type: ce
    uniform_encoded: false
    entropy_to_count: false
    bscheduler: loglinear
    without_T: false
  eval:
    checkpoint_path: ''
    disable_ema: false
    compute_generative_perplexity: false
    perplexity_batch_size: 8
    compute_perplexity_on_sanity: false
    gen_ppl_eval_model_name_or_path: /AIRvePFS/ai4science/users/yupei/data/gpt2-large
    generate_samples: true
    new_diff_calculate: full
  optim:
    weight_decay: 0
    lr: 0.0005
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
  trainer:
    _target_: lightning.Trainer
    accelerator: cuda
    num_nodes: 1
    devices: 1
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
    precision: bf16
    num_sanity_val_steps: 2
    max_steps: 1000000
    log_every_n_steps: 100
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    val_check_interval: 100
  gamma: 0
  wandb:
    project: Discrete-diffusion
    notes: Init for dugging
    group: null
    job_type: null
    name: null
    tags:
    - loglinear
    - Mel
    - Mel
    resume: null
  checkpointing:
    save_dir: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM/outputs/Mel/2025.08.23/024137
    resume_from_ckpt: false
    resume_ckpt_path: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM/outputs/Mel/2025.08.23/024137/checkpoints/last.ckpt
  callbacks:
    checkpoint_every_n_steps:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: -1
      save_last: true
      dirpath: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM/outputs/Mel/2025.08.23/024137/checkpoints
      verbose: true
      auto_insert_metric_name: false
      every_n_train_steps: 1000
      filename: step_{step}
    checkpoint_monitor:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val/loss
      mode: min
      save_top_k: 1
      save_last: false
      dirpath: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM/outputs/Mel/2025.08.23/024137/checkpoints
      filename: best
      auto_insert_metric_name: false
      verbose: true
    learning_rate_monitor:
      _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: step
  data:
    train: Mel
    valid: Mel
    tokenizer_name_or_path: Mel
    cache_dir: /AIRvePFS/ai4science/users/yupei/data/dna_data/
    wrap: true
    streaming: false
    mel_enhancer: false
  model:
    name: small
    type: ddit
    hidden_size: 768
    cond_dim: 128
    length: 500
    n_blocks: 12
    n_heads: 12
    scale_by_sigma: true
    dropout: 0.1
    tie_word_embeddings: false
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    find_unused_parameters: false
  noise:
    type: loglinear
    sigma_min: 0.0001
    sigma_max: 20
  lr_scheduler:
    _target_: transformers.get_constant_schedule_with_warmup
    num_warmup_steps: 2500
tokenizer: null
