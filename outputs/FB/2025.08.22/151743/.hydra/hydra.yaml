hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model=small
    - data=FB
    - parameterization=new_diff
    - backbone=FB
    - model.length=500
    - eval.compute_generative_perplexity=False
    - sampling.steps=200
    - loader.global_batch_size=32
    - training.different_time=True
    - training.onehot_sparse=True
    - mode=eval
    - eval.checkpoint_path=/AIRvePFS/ai4science/users/yupei/test_slm_repo/ckpt/FB_best.ckpt
    - gamma=2.7
    - trainer.devices=1
  job:
    name: main
    chdir: true
    override_dirname: backbone=FB,data=FB,eval.checkpoint_path=/AIRvePFS/ai4science/users/yupei/test_slm_repo/ckpt/FB_best.ckpt,eval.compute_generative_perplexity=False,gamma=2.7,loader.global_batch_size=32,mode=eval,model.length=500,model=small,parameterization=new_diff,sampling.steps=200,trainer.devices=1,training.different_time=True,training.onehot_sparse=True
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM/outputs/FB/2025.08.22/151743
    choices:
      lr_scheduler: constant_warmup
      noise: loglinear
      strategy: ddp
      model: small
      data: FB
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
