hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model=evodiff
    - data=uniref50
    - mode=sample_eval
    - parameterization=new_diff
    - backbone=dit_bfn
    - model.length=1024
    - sampling.length=400
    - sampling.outdir=/AIRvePFS/ai4science/users/yupei/test_slm_repo/output/output_protein
    - eval.compute_generative_perplexity=False
    - wandb.name=sample_uniref_evodiff
    - sampling.steps=500
    - trainer.val_check_interval=500
    - training.beta_bfn=0.75
    - checkpointing.resume_from_ckpt=True
    - T=500
    - loader.global_batch_size=100
    - eval.new_diff_calculate=full
    - eval.checkpoint_path=/AIRvePFS/ai4science/users/yupei/test_slm_repo/ckpt/Uniref_protein.ckpt
    - trainer.devices=1
  job:
    name: main
    chdir: true
    override_dirname: T=500,backbone=dit_bfn,checkpointing.resume_from_ckpt=True,data=uniref50,eval.checkpoint_path=/AIRvePFS/ai4science/users/yupei/test_slm_repo/ckpt/Uniref_protein.ckpt,eval.compute_generative_perplexity=False,eval.new_diff_calculate=full,loader.global_batch_size=100,mode=sample_eval,model.length=1024,model=evodiff,parameterization=new_diff,sampling.length=400,sampling.outdir=/AIRvePFS/ai4science/users/yupei/test_slm_repo/output/output_protein,sampling.steps=500,trainer.devices=1,trainer.val_check_interval=500,training.beta_bfn=0.75,wandb.name=sample_uniref_evodiff
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM-pro
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM-pro/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM-pro/outputs/uniref50/2025.08.22/084531
    choices:
      lr_scheduler: constant_warmup
      noise: loglinear
      strategy: ddp
      model: evodiff
      data: uniref50
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
