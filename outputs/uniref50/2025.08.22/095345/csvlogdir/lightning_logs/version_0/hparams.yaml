  - B
  - Z
  - X
  - J
  - O
  - U
  - '-'
  - '*'
  - '#'
  - '@'
  - '!'
  bos_token: '@'
  eos_token: '*'
  gap_token: '-'
  i_to_a: !!python/object/apply:numpy.core.multiarray._reconstruct
    args:
    - !!python/name:numpy.ndarray ''
    - !!python/tuple
      - 0
    - !!binary |
      Yg==
    state: !!python/tuple
    - 1
    - !!python/tuple
      - 31
    - !!python/object/apply:numpy.dtype
      args:
      - U1
      - false
      - true
      state: !!python/tuple
      - 3
      - <
      - null
      - null
      - null
      - 4
      - 4
      - 8
    - false
    - !!binary |
      QQAAAEMAAABEAAAARQAAAEYAAABHAAAASAAAAEkAAABLAAAATAAAAE0AAABOAAAAUAAAAFEAAABS
      AAAAUwAAAFQAAABWAAAAVwAAAFkAAABCAAAAWgAAAFgAAABKAAAATwAAAFUAAAAtAAAAKgAAACMA
      AABAAAAAIQAAAA==
  mask_token: '#'
  pad_token: '!'
  padding_side: null
  sep_token: /
  sequences: false
  truncation_side: null
  vocab_size: 31
