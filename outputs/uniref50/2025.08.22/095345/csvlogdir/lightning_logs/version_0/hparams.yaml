config:
  T: 500
  backbone: dit_bfn
  callbacks:
    checkpoint_every_n_steps:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      auto_insert_metric_name: false
      dirpath: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM-pro/outputs/uniref50/2025.08.22/095345/checkpoints
      every_n_train_steps: 1000
      filename: step_{step}
      save_last: true
      save_top_k: -1
      verbose: true
    checkpoint_monitor:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      auto_insert_metric_name: false
      dirpath: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM-pro/outputs/uniref50/2025.08.22/095345/checkpoints
      filename: best
      mode: min
      monitor: val/nll
      save_last: false
      save_top_k: 1
      verbose: true
    learning_rate_monitor:
      _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: step
  checkpointing:
    resume_ckpt_path: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM-pro/outputs/uniref50/2025.08.22/095345/checkpoints/last.ckpt
    resume_from_ckpt: false
    save_dir: /AIRvePFS/ai4science/users/yupei/test_slm_repo/SLM-pro/outputs/uniref50/2025.08.22/095345
  data:
    cache_dir: /AIRvePFS/ai4science/users/yupei/data/uniref50/
    extra:
      bucket_size: 1000
      max_batch_size: 800
      max_tokens: 40000
      valid_subsample_rate: 83
    streaming: false
    tokenizer_name_or_path: uniref50
    train: uniref50
    valid: uniref50
    wrap: true
  diffusion: absorbing_state
  embedding_nml: false
  entropy_condition: false
  eval:
    checkpoint_path: ''
    compute_generative_perplexity: false
    compute_perplexity_on_sanity: false
    disable_ema: false
    gen_ppl_eval_model_name_or_path: /AIRvePFS/ai4science/users/yupei/data/gpt2-large
    generate_samples: true
    new_diff_calculate: full
    perplexity_batch_size: 8
  fixed_embedding: false
  gamma: 0.5
  init_pre_embedding: false
  loader:
    batch_size: 128
    eval_batch_size: 128
    eval_global_batch_size: 128
    global_batch_size: 128
    num_workers: 0
    pin_memory: true
  logging_dir: csvlogdir
  lr_scheduler:
    _target_: transformers.get_constant_schedule_with_warmup
    num_warmup_steps: 2500
  mode: train
  model:
    cond_dim: 128
    dropout: 0.1
    hidden_size: 480
    length: 1024
    n_blocks: 12
    n_heads: 8
    name: tiny
    scale_by_sigma: true
    tie_word_embeddings: false
    type: ddit
  noise:
    sigma_max: 20
    sigma_min: 0.0001
    type: loglinear
  optim:
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
    lr: 0.0005
    weight_decay: 0
  parameterization: new_diff
  prior: uniform
  sampling:
    length: 400
    noise_removal: true
    num_sample_batches: 1
    num_sample_log: 100
    num_strides: 1
    outdir: None
    predictor: ddpm_cache
    semi_ar: false
    steps: 500
    stride_length: 1
  seed: 1
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    find_unused_parameters: false
  subs_masking: false
  time_conditioning: true
  trainer:
    _target_: lightning.Trainer
    accelerator: cuda
    accumulate_grad_batches: 1
    devices: 1
    gradient_clip_val: 1.0
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    log_every_n_steps: 100
    max_steps: 1000000
    num_nodes: 1
    num_sanity_val_steps: 2
    precision: bf16
    val_check_interval: 500
  training:
    antithetic_sampling: true
    beta_bfn: 0.75
    bscheduler: loglinear
    change_of_variables: false
    different_time: true
    ema: 0.9999
    entropy_to_count: false
    importance_sampling: false
    linear_trans: 1.0
    onehot_sparse: false
    reconstruct_only: false
    reconstruct_type: ce
    reconstruct_weight: 0.0
    sampling_eps: 0.001
    scheduler: square
    top_nums: -1
    uniform_encoded: false
    without_T: false
  wandb:
    group: null
    job_type: null
    name: tiny_uniref_evodiff
    notes: Init for dugging
    project: Discrete-diffusion
    resume: null
    tags:
    - loglinear
    - uniref50
    - uniref50
